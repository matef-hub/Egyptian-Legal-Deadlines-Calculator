name: CI Verification

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-ci:
    name: Web Calculator (Lint, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean reproducible dependency installation
        run: npm ci

      - name: Run TypeScript typecheck / lint
        run: npm run lint

      - name: Run Web Procedural Unit Tests
        run: npm test

      - name: Run Web Production Build
        run: npm run build

  android-ci:
    name: Android App (Lint, Test, Assemble)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Verify No Test Files In Production Source Sets
        run: |
          MISPLACED=$(find app/src/main -name "*Test*.kt" | wc -l)
          if [ "$MISPLACED" -gt 0 ]; then
            echo "::error::Found test files in production source set app/src/main:"
            find app/src/main -name "*Test*.kt"
            exit 1
          fi
          echo "Production source set clean of test files."

      - name: Verify JUnit Not In Production Source Sets
        run: |
          JUNIT_IMPORTS=$(grep -rn "org.junit" app/src/main/ || true)
          if [ -n "$JUNIT_IMPORTS" ]; then
            echo "::error::JUnit imported in production source set:"
            echo "$JUNIT_IMPORTS"
            exit 1
          fi
          echo "No JUnit imports found in production source set."

      - name: Run Android Unit Tests, Assemble Debug APK & Lint
        run: ./gradlew testDebugUnitTest assembleDebug lint --stacktrace
