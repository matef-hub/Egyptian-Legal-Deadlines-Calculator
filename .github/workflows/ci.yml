name: CI Verification

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-ci:
    name: Web Calculator (Lint, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean reproducible dependency installation
        run: npm ci

      - name: Run TypeScript typecheck / lint
        run: npm run lint

      - name: Run Web Procedural Unit Tests
        run: npm test

      - name: Run Web Production Build
        run: npm run build

  android-ci:
    name: Android App (Lint, Test, Assemble)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Verify No Test Files In Production Source Sets
        run: |
          MISPLACED=$(find app/src/main -name "*Test*.kt" | wc -l)
          if [ "$MISPLACED" -gt 0 ]; then
            echo "::error::Found test files in production source set app/src/main:"
            find app/src/main -name "*Test*.kt"
            exit 1
          fi
          echo "Production source set clean of test files."

      - name: Verify JUnit Not In Production Source Sets
        run: |
          JUNIT_IMPORTS=$(grep -rn "org.junit" app/src/main/ || true)
          if [ -n "$JUNIT_IMPORTS" ]; then
            echo "::error::JUnit imported in production source set:"
            echo "$JUNIT_IMPORTS"
            exit 1
          fi
          echo "No JUnit imports found in production source set."

      - name: Run Android unit tests, compile Compose UI tests, assemble debug and lint
        run: ./gradlew testDebugUnitTest assembleDebugAndroidTest assembleDebug lint --stacktrace

      - name: Verify production packaging and the exported Room schema
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/android-signing-test.p12"
          trap 'rm -f "$KEY"' EXIT
          PASS=$(openssl rand -hex 24)
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$KEY" -alias acceptance \
            -storepass "$PASS" -keypass "$PASS" -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI acceptance"
          ./gradlew :app:assembleRelease :app:bundleRelease :app:lintRelease \
            "-Pandroid.injected.signing.store.file=$KEY" "-Pandroid.injected.signing.store.password=$PASS" \
            "-Pandroid.injected.signing.key.alias=acceptance" "-Pandroid.injected.signing.key.password=$PASS"
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose "$APK"
          jarsigner -verify "$AAB" | grep -F 'jar verified.'
          git diff --exit-code -- app/schemas

      - name: Enable KVM for device acceptance
        if: github.event_name == 'pull_request'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android device acceptance tests
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W com.ateflaw.legaldeadlines/.presentation.MainActivity
            for i in $(seq 1 12); do adb shell uiautomator dump /sdcard/meead-window.xml >/dev/null && adb shell cat /sdcard/meead-window.xml | grep -q 'المساعد الإجرائي' && break; sleep 2; done
            adb shell cat /sdcard/meead-window.xml | grep -q 'المساعد الإجرائي'
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.ateflaw.legaldeadlines.legalreview.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/meead-device-tests.txt"
            grep -Eq '^OK [(][1-9][0-9]* tests?[)]' "$RUNNER_TEMP/meead-device-tests.txt"

      - name: Publish Android debug APK for device acceptance testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legal-deadlines-android-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
